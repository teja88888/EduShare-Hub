<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="EduShare Hub is a student knowledge-sharing platform where students can share PDF notes and download educational resources with complete privacy." />
    <meta property="og:title" content="EduShare Hub – Student Knowledge Sharing Platform" />
    <meta property="og:description" content="Upload and download study materials across colleges with 100% student privacy." />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z'/></svg>" />
    <script>
      // Immediate intelligent redirection based on login token
      (function() {
        try {
          var token = localStorage.getItem('edushare_token');
          if (token) {
            window.location.replace('/dashboard.html');
          } else {
            window.location.replace('/register.html');
          }
        } catch (e) {
          window.location.replace('/register.html');
        }
      })();
    </script>
  </head>

    <div class="text-center p-8">
